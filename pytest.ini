[pytest]
testpaths = tests
pythonpath = .
markers =
    unit: Pure-logic unit tests — no external services, no network.
    integration: Tests that exercise infrastructure adapters via mocks or stubs (e.g. MongoDB, HTTP).
    ui: Tests that exercise the Streamlit UI layer via the conftest stub.
    smoke: Manual smoke tests requiring a live Ollama process; never run by default (scripts/ is excluded from testpaths).
